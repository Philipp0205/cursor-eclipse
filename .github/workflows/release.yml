name: publish-update-site

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version folder to publish (defaults to the POM version)"
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build p2 repository
        run: mvn -B verify

      - name: Resolve version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="$(sed -n 's/.*<version>\(.*\)-SNAPSHOT<\/version>.*/\1/p' pom.xml | head -1)"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # The site is a composite repository, so previously published versions must
      # survive. Check out the existing branch instead of replacing the content.
      - name: Check out existing site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          else
            git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
            cd site
            git checkout --orphan gh-pages
            git rm -rf --quiet .
          fi

      - name: Add release to the composite site
        run: ./releng/publish-site.sh "${{ steps.version.outputs.value }}" \
          releng/com.cursor.eclipse.repository/target/repository site

      - name: Push site
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Site already up to date."
            exit 0
          fi
          git commit -m "Publish update site ${{ steps.version.outputs.value }}"
          git push origin gh-pages

      - name: Summary
        run: |
          echo "### Update site published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: ${{ steps.version.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
